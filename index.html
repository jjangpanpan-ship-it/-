<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 반 알리미</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --text:#1c2230; --muted:#6b7488; --line:#e3e7f0;
    --primary:#3b6df0; --primary-soft:#e8eefe;
    --red:#e5484d; --red-soft:#fdeceb; --orange:#e08a1e; --orange-soft:#fdf3e1;
    --green:#2f9e6b; --green-soft:#e4f5ec; --gray-soft:#eef0f5;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f131c; --card:#171c28; --text:#e8ecf5; --muted:#8e98ad; --line:#272e3d;
      --primary:#6e93ff; --primary-soft:#1e2a4a;
      --red:#ff6b6f; --red-soft:#3a1d20; --orange:#f2a540; --orange-soft:#3a2d17;
      --green:#4cc38a; --green-soft:#15302386; --gray-soft:#202638;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 90px}
  header{padding:22px 0 12px}
  header h1{margin:0;font-size:22px}
  header .sub{color:var(--muted);font-size:14px;margin-top:2px}
  .notice{background:var(--primary-soft);color:var(--primary);border-radius:12px;padding:10px 14px;font-size:14px;margin:8px 0 4px}
  nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
    display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
  nav .inner{display:flex;width:100%;max-width:760px}
  nav button{flex:1;border:0;background:none;padding:10px 0 9px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer}
  nav button .ic{display:block;font-size:20px;line-height:1.2}
  nav button.on{color:var(--primary);font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
  .card h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px;justify-content:space-between}
  .card h2 small{font-weight:400;color:var(--muted);font-size:13px}
  .empty{color:var(--muted);font-size:14px;padding:6px 0}
  /* 시간표 목록 */
  .period{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px}
  .period + .period{margin-top:2px}
  .period .no{width:46px;font-size:13px;color:var(--muted);flex:none}
  .period .sub{font-weight:600;flex:1}
  .period .tm{font-size:12px;color:var(--muted)}
  .period.now{background:var(--primary-soft)}
  .period.now .sub{color:var(--primary)}
  .period.changed .sub::after{content:" 변경";font-size:11px;color:var(--orange);background:var(--orange-soft);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:600}
  .badge{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;white-space:nowrap}
  .b-red{background:var(--red-soft);color:var(--red)}
  .b-orange{background:var(--orange-soft);color:var(--orange)}
  .b-blue{background:var(--primary-soft);color:var(--primary)}
  .b-gray{background:var(--gray-soft);color:var(--muted)}
  .b-green{background:var(--green-soft);color:var(--green)}
  /* 수행평가 */
  .item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:0}
  .item .dd{flex:none;width:58px;text-align:center}
  .item .body{flex:1;min-width:0}
  .item .t{font-weight:700}
  .item .meta{font-size:13px;color:var(--muted);margin-top:1px}
  .item .det{font-size:14px;margin-top:4px}
  .item.past{opacity:.55}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .opt{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin:6px 0}
  /* 준비물 */
  .sup{padding:8px 0;border-top:1px solid var(--line)}
  .sup:first-of-type{border-top:0}
  .sup .sj{font-weight:700;font-size:14px;margin-bottom:4px}
  label.chk{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:15px;cursor:pointer}
  label.chk input{width:18px;height:18px;accent-color:var(--primary)}
  label.chk input:checked + span{text-decoration:line-through;color:var(--muted)}
  /* 주간 시간표 표 */
  .tbl-wrap{overflow-x:auto}
  table.tt{width:100%;border-collapse:separate;border-spacing:3px;min-width:420px;table-layout:fixed}
  table.tt th,table.tt td{text-align:center;padding:9px 2px;border-radius:9px;font-size:14px}
  table.tt thead th{background:none;font-size:13px;color:var(--muted);font-weight:600}
  table.tt thead th small{display:block;font-weight:400;font-size:11px}
  table.tt thead th.today{color:var(--primary);font-weight:800}
  table.tt tbody th{width:52px;font-size:12px;color:var(--muted);font-weight:600}
  table.tt tbody th small{display:block;font-weight:400;font-size:10px}
  table.tt td{background:var(--gray-soft);font-weight:600}
  table.tt td.today{background:var(--primary-soft)}
  table.tt td.now{background:var(--primary);color:#fff}
  table.tt td.changed{background:var(--orange-soft);color:var(--orange)}
  table.tt td.blank{background:none}
  table.tt tr.lunch td{background:none;color:var(--muted);font-weight:400;font-size:12px;padding:3px}
  .weeknav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .weeknav button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  .weeknav span{font-weight:700;font-size:14px}
  .changes{font-size:13px;margin-top:10px;color:var(--muted)}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
  .meal + .meal{margin-top:14px}
  .meal ul{list-style:none;margin:6px 0 0;padding:0}
  .meal li{padding:4px 0;font-size:15px}
  .meal li small{color:var(--muted);font-size:11px;margin-left:6px}
  .meal .cal{font-size:12px;color:var(--muted);margin-left:6px}
  .meal-note{font-size:12px;color:var(--muted);margin-top:8px}
  .pre{white-space:pre-wrap;word-break:break-word}
  .item a{color:var(--primary)}
  .vh{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  .vh ul{margin:6px 0 0;padding-left:20px;font-size:14px}
  .mrow{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .mrow .md{flex:none;width:70px;font-weight:700;font-size:14px}
  .mrow .mb{flex:1;min-width:0;font-size:14px;line-height:1.6}
  .mrow.today{background:var(--primary-soft);border-radius:10px;padding-left:8px;padding-right:8px;border-top-color:transparent}
  .meal-note a{color:var(--primary)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">우리 반 알리미</h1>
    <div class="sub" id="today"></div>
    <div class="notice" id="notice" hidden></div>
  </header>
  <main id="view"></main>
  <footer id="foot"></footer>
</div>

<nav><div class="inner" id="nav">
  <button data-tab="home"><span class="ic">🏠</span>홈</button>
  <button data-tab="timetable"><span class="ic">🗓️</span>시간표</button>
  <button data-tab="assess"><span class="ic">📝</span>수행평가</button>
  <button data-tab="supply"><span class="ic">🎒</span>준비물</button>
  <button data-tab="meal"><span class="ic">🍚</span>급식</button>
  <button data-tab="etc"><span class="ic">📢</span>기타</button>
</div></nav>

<script src="data.js"></script>
<script>
"use strict";
/* data.js 를 못 읽었을 때: 빈 화면 대신 안내를 보여줌 */
if (typeof CLASS_INFO === "undefined" || typeof TIMETABLE === "undefined" ||
    typeof ASSESSMENTS === "undefined" || typeof SUPPLIES === "undefined" || typeof CHANGES === "undefined") {
  document.getElementById("view").innerHTML =
    '<div class="card"><h2>⚠️ data.js 를 읽지 못했어요</h2>' +
    '<div class="det">data.js 안에 오타가 있거나(쉼표·따옴표·괄호 빠짐), 파일이 index.html 과 같은 폴더에 없어요.<br>' +
    'PC에서 F12 → Console 탭의 빨간 글씨에 틀린 줄 번호가 나와요.</div></div>';
  throw new Error("data.js 로딩 실패");
}
const DAYS = ["일","월","화","수","목","금","토"];
const state = { tab: "home", subject: "전체", showPast: false, weekOffset: 0, mealRange: "week", mealOffset: 0 };

/* ---------- 유틸 ---------- */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function parseDate(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function fmtDate(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function diffDays(a, b){ return Math.round((startOfDay(a) - startOfDay(b)) / 864e5); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function korDate(d){ return (d.getMonth()+1) + "월 " + d.getDate() + "일 (" + DAYS[d.getDay()] + ")"; }
function ddayLabel(n){ return n === 0 ? "D-DAY" : n > 0 ? "D-" + n : "D+" + (-n); }
function ddayClass(n){ return n < 0 ? "b-gray" : n <= 3 ? "b-red" : n <= 7 ? "b-orange" : "b-blue"; }
function toMin(t){ const [h,m] = t.split(":").map(Number); return h*60 + m; }
function nextSchoolDay(from){ let d = addDays(from, 1); while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1); return d; }

function getDaySchedule(date){
  const base = (TIMETABLE[DAYS[date.getDay()]] || []).map(s => ({ subject: s, changed: false, note: "" }));
  const key = fmtDate(date);
  CHANGES.filter(c => c.date === key).forEach(c => {
    const i = c.period - 1;
    while (base.length <= i) base.push({ subject: "", changed: false, note: "" });
    base[i] = { subject: c.subject, changed: true, note: c.note || "" };
  });
  return base;
}
function currentPeriod(now){
  const m = now.getHours()*60 + now.getMinutes();
  for (let i = 0; i < PERIOD_TIMES.length; i++){
    if (m >= toMin(PERIOD_TIMES[i][0]) && m <= toMin(PERIOD_TIMES[i][1])) return i;
  }
  return -1;
}
function suppliesOn(date){ const k = fmtDate(date); return SUPPLIES.filter(s => s.date === k); }

/* 체크 상태 저장 (내 기기에만 저장) */
function loadChecked(){ try { return JSON.parse(localStorage.getItem("supplyChecked") || "{}"); } catch(e){ return {}; } }
function saveChecked(o){ try { localStorage.setItem("supplyChecked", JSON.stringify(o)); } catch(e){} }

/* ---------- 조각 렌더링 ---------- */
function renderPeriodList(date, now, highlightNow){
  const list = getDaySchedule(date);
  if (!list.length) return '<div class="empty">시간표가 없는 날이에요.</div>';
  const cur = highlightNow ? currentPeriod(now) : -1;
  return list.map((p, i) => {
    const t = PERIOD_TIMES[i];
    return '<div class="period' + (i === cur ? " now" : "") + (p.changed ? " changed" : "") + '">' +
      '<div class="no">' + (i+1) + '교시</div>' +
      '<div class="sub">' + esc(p.subject || "-") + (p.note ? ' <span class="tm">(' + esc(p.note) + ')</span>' : "") + '</div>' +
      '<div class="tm">' + (t ? t[0] + " ~ " + t[1] : "") + '</div></div>';
  }).join("");
}
function renderSupplyBlocks(items, checked){
  if (!items.length) return '<div class="empty">등록된 준비물이 없어요.</div>';
  return items.map(s => '<div class="sup"><div class="sj">' + esc(s.subject) + '</div>' +
    s.items.map(it => {
      const key = s.date + "|" + s.subject + "|" + it;
      return '<label class="chk"><input type="checkbox" data-key="' + esc(key) + '"' + (checked[key] ? " checked" : "") + '><span>' + esc(it) + '</span></label>';
    }).join("") + '</div>').join("");
}
function renderAssessItem(a, today){
  const n = diffDays(parseDate(a.date), today);
  return '<div class="item' + (n < 0 ? " past" : "") + '">' +
    '<div class="dd"><span class="badge ' + ddayClass(n) + '">' + ddayLabel(n) + '</span></div>' +
    '<div class="body"><div class="t">' + esc(a.subject) + ' · ' + esc(a.title) + '</div>' +
    '<div class="meta">' + korDate(parseDate(a.date)) + (a.score ? " · 배점 " + esc(a.score) + "점" : "") + '</div>' +
    (a.detail ? '<div class="det">' + esc(a.detail) + '</div>' : "") + '</div></div>';
}

/* ---------- 급식 (나이스 교육정보 개방 포털) ---------- */
const mealCache = {};

/* 한 번에 너무 많이 요청하지 않도록 동시에 4개씩만 보냄 */
let mealActive = 0;
const mealQueue = [];
function queuedFetch(url){
  return new Promise((res, rej) => { mealQueue.push({ url: url, res: res, rej: rej }); pumpMeal(); });
}
function pumpMeal(){
  while (mealActive < 4 && mealQueue.length){
    const t = mealQueue.shift();
    mealActive++;
    fetch(t.url).then(t.res, t.rej).finally(() => { mealActive--; pumpMeal(); });
  }
}
function ymd(d){ return fmtDate(d).replace(/-/g, ""); }

function loadMeal(date){
  const key = ymd(date);
  if (mealCache[key]) return mealCache[key];
  try { const s = sessionStorage.getItem("meal-" + key); if (s){ mealCache[key] = JSON.parse(s); return mealCache[key]; } } catch(e){}
  mealCache[key] = { status: "loading" };
  let url = "https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pIndex=1&pSize=10" +
    "&ATPT_OFCDC_SC_CODE=" + encodeURIComponent(MEAL_CONFIG.officeCode) +
    "&SD_SCHUL_CODE=" + encodeURIComponent(MEAL_CONFIG.schoolCode) +
    "&MLSV_YMD=" + key;
  if (MEAL_CONFIG.apiKey) url += "&KEY=" + encodeURIComponent(MEAL_CONFIG.apiKey);
  queuedFetch(url).then(r => r.json()).then(j => {
    const root = j.mealServiceDietInfo;
    let result;
    if (root && root[1] && root[1].row){
      result = { status: "ok", meals: root[1].row.map(r => ({ name: r.MMEAL_SC_NM, dishes: r.DDISH_NM || "", cal: r.CAL_INFO || "" })) };
    } else if (j.RESULT && j.RESULT.CODE === "INFO-200"){
      result = { status: "none" };
    } else {
      result = { status: "error" };
    }
    mealCache[key] = result;
    if (result.status !== "error"){ try { sessionStorage.setItem("meal-" + key, JSON.stringify(result)); } catch(e){} }
    render();
  }).catch(() => { mealCache[key] = { status: "error" }; render(); });
  return mealCache[key];
}

function parseDishes(raw){
  return String(raw).split(/<br\s*\/?>/i).map(s => s.trim()).filter(Boolean).map(s => {
    const m = s.match(/^(.*?)\s*\(([\d.]+)\)\s*$/);
    const name = (m ? m[1] : s).replace(/^#/, "").trim();
    return { name: name, al: m ? m[2].replace(/\./g, ",") : "" };
  });
}

function mealCard(date){
  if (typeof MEAL_CONFIG === "undefined" || !MEAL_CONFIG.enabled) return "";
  const head = '<div class="card"><h2>오늘의 급식 <small>' + korDate(date) + '</small></h2>';
  const link = (typeof MEAL_CONFIG.schoolUrl === "string" && MEAL_CONFIG.schoolUrl)
    ? ' <a href="' + esc(MEAL_CONFIG.schoolUrl) + '" target="_blank" rel="noopener">학교 홈페이지</a>' : "";
  if (date.getDay() === 0 || date.getDay() === 6) return head + '<div class="empty">주말이라 급식이 없어요 😴</div></div>';
  const m = loadMeal(date);
  if (m.status === "loading") return head + '<div class="empty">급식 정보를 불러오는 중…</div></div>';
  if (m.status === "none") return head + '<div class="empty">오늘은 등록된 급식이 없어요.</div></div>';
  if (m.status === "error") return head + '<div class="empty">급식 정보를 불러오지 못했어요.' + link + '</div></div>';
  return head + m.meals.map(x =>
    '<div class="meal"><div><span class="badge b-green">' + esc(x.name) + '</span>' +
    (x.cal ? '<span class="cal">' + esc(x.cal) + '</span>' : "") + '</div><ul>' +
    parseDishes(x.dishes).map(d => '<li>' + esc(d.name) + (d.al ? '<small>(' + esc(d.al) + ')</small>' : "") + '</li>').join("") +
    '</ul></div>').join("") +
    '<div class="meal-note">괄호 안 숫자는 알레르기 유발 식품 번호예요. 출처: 나이스 교육정보 개방 포털</div></div>';
}

/* ---------- 탭별 화면 ---------- */
function viewHome(now){
  const checked = loadChecked();
  const today = startOfDay(now);
  const tomorrow = nextSchoolDay(today);
  const isWeekday = now.getDay() >= 1 && now.getDay() <= 5;
  const upcoming = ASSESSMENTS.filter(a => diffDays(parseDate(a.date), today) >= 0)
    .sort((a,b) => a.date.localeCompare(b.date)).slice(0, 4);
  const tmrLabel = diffDays(tomorrow, today) === 1 ? "내일" : "다음 등교일";

  return '' +
    '<div class="card"><h2>오늘 시간표 <small>' + korDate(today) + '</small></h2>' +
      (isWeekday ? renderPeriodList(today, now, true) : '<div class="empty">오늘은 쉬는 날이에요 😴</div>') + '</div>' +
    mealCard(today) +
    '<div class="card"><h2>' + tmrLabel + ' 준비물 <small>' + korDate(tomorrow) + '</small></h2>' +
      renderSupplyBlocks(suppliesOn(tomorrow), checked) + '</div>' +
    '<div class="card"><h2>다가오는 수행평가 <small>가까운 순</small></h2>' +
      (upcoming.length ? upcoming.map(a => renderAssessItem(a, today)).join("") : '<div class="empty">예정된 수행평가가 없어요 🎉</div>') + '</div>' +
    '<div class="card"><h2>' + tmrLabel + ' 시간표 <small>' + korDate(tomorrow) + '</small></h2>' +
      renderPeriodList(tomorrow, now, false) + '</div>';
}

function viewTimetable(now){
  const today = startOfDay(now);
  const dow = today.getDay();
  let monday;
  if (dow === 0) monday = addDays(today, 1);
  else if (dow === 6) monday = addDays(today, 2);
  else monday = addDays(today, -(dow - 1));
  monday = addDays(monday, state.weekOffset * 7);
  const days = [0,1,2,3,4].map(i => addDays(monday, i));
  const schedules = days.map(getDaySchedule);
  const maxP = Math.max(PERIOD_TIMES.length, ...schedules.map(s => s.length));
  const cur = currentPeriod(now);
  const todayKey = fmtDate(today);

  let html = '<div class="card">' +
    '<div class="weeknav"><button data-week="-1">‹ 이전 주</button><span>' +
      (monday.getMonth()+1) + '/' + monday.getDate() + ' ~ ' + (days[4].getMonth()+1) + '/' + days[4].getDate() +
      (state.weekOffset === 0 ? " (이번 주)" : "") + '</span><button data-week="1">다음 주 ›</button></div>' +
    '<div class="tbl-wrap"><table class="tt"><thead><tr><th></th>' +
    days.map(d => '<th class="' + (fmtDate(d) === todayKey ? "today" : "") + '">' + DAYS[d.getDay()] + '<small>' + (d.getMonth()+1) + '/' + d.getDate() + '</small></th>').join("") +
    '</tr></thead><tbody>';

  for (let p = 0; p < maxP; p++){
    const t = PERIOD_TIMES[p];
    html += '<tr><th>' + (p+1) + '교시' + (t ? '<small>' + t[0] + '</small>' : "") + '</th>';
    for (let c = 0; c < 5; c++){
      const cell = schedules[c][p];
      if (!cell || !cell.subject){ html += '<td class="blank"></td>'; continue; }
      const isToday = fmtDate(days[c]) === todayKey;
      const cls = cell.changed ? "changed" : (isToday && p === cur ? "now" : (isToday ? "today" : ""));
      html += '<td class="' + cls + '">' + esc(cell.subject) + '</td>';
    }
    html += '</tr>';
    if (LUNCH_AFTER && p + 1 === LUNCH_AFTER) html += '<tr class="lunch"><td colspan="6">🍚 점심시간</td></tr>';
  }
  html += '</tbody></table></div>';

  const weekChanges = CHANGES.filter(c => { const n = diffDays(parseDate(c.date), monday); return n >= 0 && n <= 4; });
  if (weekChanges.length){
    html += '<div class="changes"><b>시간표 변경</b><br>' + weekChanges.map(c =>
      korDate(parseDate(c.date)) + ' ' + c.period + '교시 → ' + esc(c.subject) + (c.note ? " (" + esc(c.note) + ")" : "")).join("<br>") + '</div>';
  }
  return html + '</div>';
}

function viewAssess(now){
  const today = startOfDay(now);
  const subjects = ["전체"].concat(Array.from(new Set(ASSESSMENTS.map(a => a.subject))));
  let list = ASSESSMENTS.slice().sort((a,b) => a.date.localeCompare(b.date));
  if (state.subject !== "전체") list = list.filter(a => a.subject === state.subject);
  if (!state.showPast) list = list.filter(a => diffDays(parseDate(a.date), today) >= 0);

  return '<div class="card"><h2>수행평가 <small>총 ' + list.length + '건</small></h2>' +
    '<div class="chips">' + subjects.map(s => '<button class="chip' + (s === state.subject ? " on" : "") + '" data-subject="' + esc(s) + '">' + esc(s) + '</button>').join("") + '</div>' +
    '<label class="opt"><input type="checkbox" id="past"' + (state.showPast ? " checked" : "") + '> 지난 수행평가도 보기</label>' +
    (list.length ? list.map(a => renderAssessItem(a, today)).join("") : '<div class="empty">표시할 수행평가가 없어요.</div>') + '</div>';
}

function viewSupply(now){
  const today = startOfDay(now);
  const checked = loadChecked();
  const dates = Array.from(new Set(SUPPLIES.map(s => s.date))).filter(d => diffDays(parseDate(d), today) >= 0).sort();
  if (!dates.length) return '<div class="card"><h2>준비물</h2><div class="empty">예정된 준비물이 없어요.</div></div>';
  return dates.map(d => {
    const dt = parseDate(d), n = diffDays(dt, today);
    return '<div class="card"><h2>' + korDate(dt) + ' <span class="badge ' + ddayClass(n) + '">' + ddayLabel(n) + '</span></h2>' +
      renderSupplyBlocks(SUPPLIES.filter(s => s.date === d), checked) + '</div>';
  }).join("") + '<div class="empty" style="text-align:center">체크 표시는 이 기기에만 저장돼요.</div>';
}

/* ---------- 급식 탭 (주간 / 월간) ---------- */
function mealBody(m, detailed){
  if (m.status === "loading") return '<div class="empty">불러오는 중…</div>';
  if (m.status === "none") return '<div class="empty">급식 없음</div>';
  if (m.status === "error") return '<div class="empty">불러오지 못했어요</div>';
  if (detailed){
    return m.meals.map(x =>
      '<div class="meal"><div><span class="badge b-green">' + esc(x.name) + '</span>' +
      (x.cal ? '<span class="cal">' + esc(x.cal) + '</span>' : "") + '</div><ul>' +
      parseDishes(x.dishes).map(d => '<li>' + esc(d.name) + (d.al ? '<small>(' + esc(d.al) + ')</small>' : "") + '</li>').join("") +
      '</ul></div>').join("");
  }
  return m.meals.map(x =>
    (x.name !== "중식" ? '<span class="badge b-green">' + esc(x.name) + '</span> ' : "") +
    parseDishes(x.dishes).map(d => esc(d.name)).join(" · ")).join("<br>");
}

function viewMeal(now){
  if (typeof MEAL_CONFIG === "undefined" || !MEAL_CONFIG.enabled){
    return '<div class="card"><h2>급식</h2><div class="empty">data.js 에 MEAL_CONFIG 블록을 추가하면 급식이 보여요.</div></div>';
  }
  const today = startOfDay(now);
  const todayKey = fmtDate(today);
  const isWeek = state.mealRange === "week";
  let days = [], title = "";

  if (isWeek){
    const dow = today.getDay();
    let monday = dow === 0 ? addDays(today, 1) : dow === 6 ? addDays(today, 2) : addDays(today, -(dow - 1));
    monday = addDays(monday, state.mealOffset * 7);
    days = [0,1,2,3,4].map(i => addDays(monday, i));
    title = (monday.getMonth()+1) + "/" + monday.getDate() + " ~ " + (days[4].getMonth()+1) + "/" + days[4].getDate() +
      (state.mealOffset === 0 ? " (이번 주)" : "");
  } else {
    const first = new Date(today.getFullYear(), today.getMonth() + state.mealOffset, 1);
    const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    for (let d = 1; d <= last; d++){
      const x = new Date(first.getFullYear(), first.getMonth(), d);
      if (x.getDay() !== 0 && x.getDay() !== 6) days.push(x);
    }
    title = first.getFullYear() + "년 " + (first.getMonth()+1) + "월" + (state.mealOffset === 0 ? " (이번 달)" : "");
  }

  const rows = days.map(d => {
    const m = loadMeal(d);
    const isToday = fmtDate(d) === todayKey;
    return '<div class="mrow' + (isToday ? " today" : "") + '"><div class="md">' + (d.getMonth()+1) + '/' + d.getDate() + ' (' + DAYS[d.getDay()] + ')' +
      (isToday ? '<br><span class="badge b-blue">오늘</span>' : "") + '</div><div class="mb">' + mealBody(m, isWeek) + '</div></div>';
  }).join("");

  return '<div class="card">' +
    '<div class="chips"><button class="chip' + (isWeek ? " on" : "") + '" data-mrange="week">주간</button>' +
    '<button class="chip' + (!isWeek ? " on" : "") + '" data-mrange="month">월간</button></div>' +
    '<div class="weeknav"><button data-moff="-1">‹ 이전</button><span>' + title + '</span><button data-moff="1">다음 ›</button></div>' +
    rows +
    '<div class="meal-note">' + (isWeek ? '괄호 안 숫자는 알레르기 유발 식품 번호예요. ' : '알레르기 번호는 주간 보기에서 볼 수 있어요. ') +
    '출처: 나이스 교육정보 개방 포털</div></div>';
}

/* ---------- 기타 탭 (공지사항 + 버전 정보) ---------- */
function safeUrl(u){ return /^https?:\/\//i.test(u || "") ? u : ""; }

function viewEtc(now){
  const today = startOfDay(now);
  let html = "";

  // 기타 공지사항
  if (typeof NOTICES === "undefined" || !Array.isArray(NOTICES)){
    html += '<div class="card"><h2>기타 공지사항</h2><div class="empty">data.js 에 NOTICES 블록을 추가하면 공지가 보여요.</div></div>';
  } else {
    const list = NOTICES.slice().sort((a, b) => {
      if (!!b.important !== !!a.important) return b.important ? 1 : -1;
      return String(b.date || "").localeCompare(String(a.date || ""));
    });
    html += '<div class="card"><h2>기타 공지사항 <small>총 ' + list.length + '건</small></h2>' +
      (list.length ? list.map(n => {
        const hasDate = /^\d{4}-\d{2}-\d{2}$/.test(n.date || "");
        const isNew = hasDate && diffDays(today, parseDate(n.date)) <= 2 && diffDays(today, parseDate(n.date)) >= 0;
        const url = safeUrl(n.link);
        return '<div class="item"><div class="dd"><span class="badge ' + (n.important ? "b-red" : "b-gray") + '">' + (n.important ? "중요" : "공지") + '</span></div>' +
          '<div class="body"><div class="t">' + esc(n.title) + (isNew ? ' <span class="badge b-orange">NEW</span>' : "") + '</div>' +
          (hasDate ? '<div class="meta">' + korDate(parseDate(n.date)) + '</div>' : "") +
          (n.content ? '<div class="det pre">' + esc(n.content) + '</div>' : "") +
          (url ? '<div class="det"><a href="' + esc(url) + '" target="_blank" rel="noopener">자세히 보기 ›</a></div>' : "") +
          '</div></div>';
      }).join("") : '<div class="empty">등록된 공지가 없어요.</div>') + '</div>';
  }

  // 버전 정보
  if (typeof VERSION_INFO === "undefined"){
    html += '<div class="card"><h2>버전 정보</h2><div class="empty">data.js 에 VERSION_INFO 블록을 추가하면 버전 정보가 보여요.</div></div>';
  } else {
    const v = VERSION_INFO;
    html += '<div class="card"><h2>버전 정보 <small>v' + esc(v.version) + '</small></h2>' +
      (v.updated ? '<div class="meta">최근 업데이트: ' + esc(v.updated) + '</div>' : "") +
      (v.description ? '<div class="det pre">' + esc(v.description) + '</div>' : "") +
      (Array.isArray(v.history) ? v.history.map(h =>
        '<div class="vh"><b>v' + esc(h.version) + '</b> <span class="tm">' + esc(h.date || "") + '</span>' +
        (Array.isArray(h.changes) ? '<ul>' + h.changes.map(c => '<li>' + esc(c) + '</li>').join("") + '</ul>' : "") + '</div>').join("") : "") +
      '</div>';
  }
  return html;
}

/* ---------- 전체 렌더 ---------- */
function render(){
  const now = new Date();
  document.getElementById("title").textContent = CLASS_INFO.name + " 알리미";
  document.title = CLASS_INFO.name + " 알리미";
  document.getElementById("today").textContent = korDate(now) + " · " + String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0") + " 기준";
  const nt = document.getElementById("notice");
  nt.hidden = !CLASS_INFO.notice;
  nt.textContent = "📢 " + (CLASS_INFO.notice || "");
  document.getElementById("foot").textContent = "담당: " + CLASS_INFO.manager +
    (typeof VERSION_INFO !== "undefined" && VERSION_INFO.version ? " · v" + VERSION_INFO.version : "");

  const views = { home: viewHome, timetable: viewTimetable, assess: viewAssess, supply: viewSupply, meal: viewMeal, etc: viewEtc };
  document.getElementById("view").innerHTML = (views[state.tab] || viewHome)(now);
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === state.tab));
}

/* ---------- 이벤트 ---------- */
document.getElementById("nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (!b) return;
  state.tab = b.dataset.tab;
  try { history.replaceState(null, "", "#" + state.tab); } catch(err){}
  render(); window.scrollTo(0, 0);
});
document.getElementById("view").addEventListener("click", e => {
  const chip = e.target.closest("[data-subject]");
  if (chip){ state.subject = chip.dataset.subject; render(); return; }
  const mr = e.target.closest("[data-mrange]");
  if (mr){ state.mealRange = mr.dataset.mrange; state.mealOffset = 0; render(); return; }
  const mo = e.target.closest("[data-moff]");
  if (mo){ state.mealOffset += Number(mo.dataset.moff); render(); return; }
  const wk = e.target.closest("[data-week]");
  if (wk){ state.weekOffset += Number(wk.dataset.week); render(); }
});
document.getElementById("view").addEventListener("change", e => {
  if (e.target.id === "past"){ state.showPast = e.target.checked; render(); return; }
  if (e.target.dataset && e.target.dataset.key){
    const o = loadChecked();
    if (e.target.checked) o[e.target.dataset.key] = true; else delete o[e.target.dataset.key];
    saveChecked(o);
    render(); // 같은 항목이 다른 카드에도 있으면 함께 갱신
  }
});

const hash = location.hash.replace("#", "");
if (["home","timetable","assess","supply","meal","etc"].includes(hash)) state.tab = hash;
render();
setInterval(render, 60000); // 1분마다 현재 교시/시간 갱신
</script>
</body>
</html>
